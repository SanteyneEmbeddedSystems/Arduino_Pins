<?xml version="1.0" encoding="UTF-8"?><svg  Version="1.1"  xmlns="http://www.w3.org/2000/svg"  xmlns:xlink="http://www.w3.org/1999/xlink"  xmlns:svg="http://www.w3.org/2000/svg"  width="770px" height="363px">  <style>text{font-size:12px;font-family:Consolas;fill:gray;text-anchor:start;}</style>  <style>svg { background-Color: black; color: white;}</style>
  <defs>
  <g id="4eeca9ec-7286-40ae-967e-7332053b6d5b_alt">
  <defs>
  <g id="058963e7-375f-4f57-aceb-5a2f36b75490">
  <rect x="0px" y="0px" width="230px" height="35px"
    style="fill:rgb(136,0,21);fill-opacity:0.3;stroke:rgb(136,0,21);stroke-width:1px"/>
  <text style="font-size:10px;text-anchor:middle;" x="115px" y="13px">&lt;&lt;Basic_Integer_Type&gt;&gt;</text>
  <text style="font-size:12px;text-anchor:middle;font-weight:bold;" x="115px" y="28px">uint8</text>
  <rect x="0px" y="35px" width="230px" height="65px"
    style="fill:rgb(136,0,21);fill-opacity:0.2;stroke:rgb(136,0,21);stroke-width:1px"/>
  <text style="font-size:12px;" x="10px" y="48px">Pre-defined basic data type</text>
  <text style="font-size:12px;" x="10px" y="63px">which allows to model a data</text>
  <text style="font-size:12px;" x="10px" y="78px">representing a unsigned integer</text>
  <text style="font-size:12px;" x="10px" y="93px">value from 0 to 255.</text>
  </g>
  </defs>
  <use xlink:href="#058963e7-375f-4f57-aceb-5a2f36b75490" transform="translate(0,0)" />
  <defs>
  <g id="5df8e979-be4c-4790-87a7-f8ee053c4162">
  <rect x="0px" y="0px" width="230px" height="35px"
    style="fill:rgb(136,0,21);fill-opacity:0.3;stroke:rgb(136,0,21);stroke-width:1px"/>
  <text style="font-size:10px;text-anchor:middle;" x="115px" y="13px">&lt;&lt;Basic_Boolean_Type&gt;&gt;</text>
  <text style="font-size:12px;text-anchor:middle;font-weight:bold;" x="115px" y="28px">boolean</text>
  <rect x="0px" y="35px" width="230px" height="65px"
    style="fill:rgb(136,0,21);fill-opacity:0.2;stroke:rgb(136,0,21);stroke-width:1px"/>
  <text style="font-size:12px;" x="10px" y="48px">Pre-defined basic data type</text>
  <text style="font-size:12px;" x="10px" y="63px">which allows to model a data</text>
  <text style="font-size:12px;" x="10px" y="78px">representing boolean value. It</text>
  <text style="font-size:12px;" x="10px" y="93px">can be true or false.</text>
  </g>
  </defs>
  <use xlink:href="#5df8e979-be4c-4790-87a7-f8ee053c4162" transform="translate(250,0)" />
  <defs>
  <g id="f9c149ee-c3eb-4b3d-b2f0-e7b6f5cdcb26">
  <rect x="0px" y="0px" width="230px" height="35px"
    style="fill:rgb(136,0,21);fill-opacity:0.3;stroke:rgb(136,0,21);stroke-width:1px"/>
  <text style="font-size:10px;text-anchor:middle;" x="115px" y="13px">&lt;&lt;Enumerated_Type&gt;&gt;</text>
  <text style="font-size:12px;text-anchor:middle;font-weight:bold;" x="115px" y="28px">E_IO_Level</text>
  <rect x="0px" y="35px" width="230px" height="50px"
    style="fill:rgb(136,0,21);fill-opacity:0.2;stroke:rgb(136,0,21);stroke-width:1px"/>
  <text style="font-size:12px;" x="10px" y="48px">Allows to model a data that</text>
  <text style="font-size:12px;" x="10px" y="63px">represents the electrical level</text>
  <text style="font-size:12px;" x="10px" y="78px">of a pin.</text>
  <rect x="0px" y="85px" width="230px" height="35px"
    style="fill:rgb(136,0,21);fill-opacity:0.2;stroke:rgb(136,0,21);stroke-width:1px"/>
  <text style="font-size:12px;" x="10px" y="98px">IO_LEVEL_HIGH</text>
  <text style="font-size:12px;" x="10px" y="113px">IO_LEVEL_LOW</text>
  </g>
  </defs>
  <use xlink:href="#f9c149ee-c3eb-4b3d-b2f0-e7b6f5cdcb26" transform="translate(500,0)" />
  <defs>
  <g id="d8db64e8-9547-4b4b-ab10-ce3984553d49">
  <rect x="0px" y="0px" width="250px" height="35px"
    style="fill:rgb(34,177,76);fill-opacity:0.3;stroke:rgb(34,177,76);stroke-width:1px"/>
  <text style="font-size:10px;text-anchor:middle;" x="125px" y="13px">&lt;&lt;Client_Server_Interface&gt;&gt;</text>
  <text style="font-size:12px;text-anchor:middle;font-weight:bold;font-style:italic;" x="125px" y="28px">Digital_Input</text>
  <rect x="0px" y="35px" width="250px" height="35px"
    style="fill:rgb(34,177,76);fill-opacity:0.2;stroke:rgb(34,177,76);stroke-width:1px"/>
  <text style="font-size:12px;" x="10px" y="48px">Gathers operations allowing to</text>
  <text style="font-size:12px;" x="10px" y="63px">manage a digital hardware input.</text>
  <rect x="0px" y="70px" width="250px" height="20px"
    style="fill:rgb(34,177,76);fill-opacity:0.2;stroke:rgb(34,177,76);stroke-width:1px"/>
  <text style="font-size:12px;font-style:italic;" x="10px" y="83px">+ Get_Level( OUT level:E_IO_Level )</text>
  </g>
  </defs>
