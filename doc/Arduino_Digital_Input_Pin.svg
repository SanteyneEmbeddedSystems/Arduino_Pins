  <defs>
  <g id="c6a19af0-4b68-4a27-b0dd-39f4f7996ca6">
  <text style="font-size:12px;text-anchor:end;" x="172px" y="15px">Digital_Pin:Digital_Input</text>
  <rect x="172px" y="18px" width="16px" height="16px"
    style="fill:rgb(255,255,255);fill-opacity:0.2;stroke:rgb(255,255,255);stroke-width:1px"/>
  <line x1="162px" y1="26px" x2="172px" y2="26px"
    style="stroke:rgb(255,255,255);stroke-width:1px"/>
  <circle cx="154px" cy="26px" r="8px"
    style="fill:rgb(255,255,255);fill-opacity:0.2;stroke:rgb(255,255,255);stroke-width:1px"/>
  </g>
  </defs>
  <use xlink:href="#c6a19af0-4b68-4a27-b0dd-39f4f7996ca6" transform="translate(0,20)" />
  <rect x="188px" y="0px" width="230px" height="35px"
    style="fill:rgb(255,255,255);fill-opacity:0.3;stroke:rgb(255,255,255);stroke-width:1px"/>
  <text style="font-size:10px;text-anchor:middle;" x="303px" y="13px">&lt;&lt;Component_Type&gt;&gt;</text>
  <text style="font-size:12px;text-anchor:middle;font-weight:bold;" x="303px" y="28px">Arduino_Digital_Input_Pin</text>
  <rect x="188px" y="35px" width="230px" height="95px"
    style="fill:rgb(255,255,255);fill-opacity:0.2;stroke:rgb(255,255,255);stroke-width:1px"/>
  <text style="font-size:12px;" x="198px" y="48px">The role of the</text>
  <text style="font-size:12px;" x="198px" y="63px">Arduino_Digital_Intput_Pin</text>
  <text style="font-size:12px;" x="198px" y="78px">component is to abstract the</text>
  <text style="font-size:12px;" x="198px" y="93px">Arduino layer allowing to get</text>
  <text style="font-size:12px;" x="198px" y="108px">the state of a digital input</text>
  <text style="font-size:12px;" x="198px" y="123px">pin.</text>
  <rect x="188px" y="130px" width="230px" height="35px"
    style="fill:rgb(255,255,255);fill-opacity:0.2;stroke:rgb(255,255,255);stroke-width:1px"/>
  <text style="font-size:12px;" x="198px" y="143px">+ Arduino_Pin_Id : uint8</text>
  <text style="font-size:12px;" x="198px" y="158px">+ Pin_Has_Pull_Up : boolean</text>
  <rect x="188px" y="165px" width="230px" height="20px"
    style="fill:rgb(255,255,255);fill-opacity:0.2;stroke:rgb(255,255,255);stroke-width:1px"/>
  <text style="font-size:12px;" x="198px" y="178px">+ Configure_Pin()</text>
  </g>
